name: Sign LiveContainer OTA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to source LiveContainer+SideStore.ipa (blank = newest matching asset in this repo's releases)"
        required: false
        default: "https://github.com/LiveContainer/LiveContainer/releases/download/nightly/LiveContainer+SideStore.ipa"
      ssh_before_auth:
        description: "Open upterm SSH session before running Apple authentication"
        required: false
        type: boolean
        default: true
      debug_upterm:
        description: "Open upterm SSH session on failure"
        required: false
        type: boolean
        default: true

# needed for the `gh release create` fallback
permissions:
  contents: write

jobs:
  sign-and-publish:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GIST_ID: a780f323dcc1db7243c296f4997f43e9
      BUNDLE_ID: com.kdt.livecontainer.V9CQYDJ2NX
      UDID: 00008130-0014442622DB803A
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools and helper scripts
        run: |
          brew install jq tmux || true
          brew install owenthereal/upterm/upterm
          mkdir -p "$HOME/bin" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          [ -f "$HOME/.ssh/id_ed25519" ] || ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"

          curl -fsSL -o "$HOME/bin/plumesign" "https://github.com/claration/impactor/releases/latest/download/plumesign-macos-universal"
          chmod +x "$HOME/bin/plumesign"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/plumesign" --help >/dev/null
          upterm version

          # ---- helper: start upterm (with a TTY via tmux), publish SSH cmd to Gist, wait ----
          cat > "$HOME/bin/start_upterm.sh" <<'UPTERM_SH'
          #!/usr/bin/env bash
          export PATH="$HOME/bin:$PATH"
          HINT="${1:-Session ready.}"
          TIMEOUT="${UPTERM_TIMEOUT:-1800}"

          tmux kill-session -t upterm-wrapper 2>/dev/null
          # upterm needs a TTY; a detached tmux session provides one
          tmux new-session -d -s upterm-wrapper -x 200 -y 50 \
            "upterm host --accept --skip-host-key-check ${UPTERM_ARGS:-} -- bash -l"

          SSH_CMD=""
          for _ in $(seq 1 60); do
            # upterm prints the session banner to the wrapper's screen, so read it from there
            SSH_CMD=$(tmux capture-pane -p -J -S -300 -t upterm-wrapper 2>/dev/null | grep -Eo 'ssh [A-Za-z0-9._@:-]+@[^[:space:]]+' | head -n 1)
            if [ -z "$SSH_CMD" ]; then
              SSH_CMD=$(upterm session current 2>/dev/null | grep -Eo 'ssh [A-Za-z0-9._@:-]+@[^[:space:]]+' | head -n 1)
            fi
            [ -n "$SSH_CMD" ] && break
            sleep 1
          done

          if [ -z "$SSH_CMD" ]; then
            echo "Could not get SSH command from upterm. tmux screen:"
            tmux capture-pane -p -t upterm-wrapper 2>/dev/null || true
            exit 1
          fi

          echo "UPTERM_SSH=$SSH_CMD"

          if [ -n "${GIST_TOKEN:-}" ]; then
            SSH_CMD="$SSH_CMD" HINT="$HINT" python3 - <<'PY' || echo "Gist update failed (continuing)"
          import json, os, urllib.request

          content = "\n".join([
              "run " + os.environ.get("GITHUB_RUN_ID", "?"),
              os.environ["HINT"],
              os.environ["SSH_CMD"],
              "",
          ])
          body = json.dumps({"files": {"upterm_ssh.txt": {"content": content}}}).encode()
          req = urllib.request.Request(
              "https://api.github.com/gists/" + os.environ["GIST_ID"],
              data=body,
              method="PATCH",
              headers={
                  "Authorization": "Bearer " + os.environ["GIST_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions",
              },
          )
          urllib.request.urlopen(req, timeout=20).read()
          print("SSH command published to Gist")
          PY
          fi

          # block until the shell exits ("exit") or we time out
          DEADLINE=$((SECONDS + TIMEOUT))
          while tmux has-session -t upterm-wrapper 2>/dev/null; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "upterm session timed out"
              tmux kill-session -t upterm-wrapper 2>/dev/null
              break
            fi
            sleep 5
          done
          UPTERM_SH

          # ---- helper: run inside the SSH shell to log in (reads secrets from env) ----
          cat > "$HOME/login_apple.sh" <<'LOGIN_SH'
          #!/usr/bin/env bash
          export PATH="$HOME/bin:$PATH"
          ID=$(printf '%s' "$APPLE_ID" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          PW=$(printf '%s' "$APPLE_PASSWORD" | tr -d '\r\n')
          plumesign account login --username "$ID" --password "$PW" || exit 1

          # Interactive (SSH) only: check this phone is registered on the account
          if [ -t 0 ] && [ -n "$UDID" ]; then
            echo
            echo "Checking whether $UDID is registered on this account..."
            script -q /tmp/devices.txt plumesign account devices
            if grep -qi "$UDID" /tmp/devices.txt; then
              echo "OK: $UDID is registered."
            else
              echo "UDID not found in the list above. If your iPhone is listed by name, you're fine."
              read -r -p "Otherwise, register $UDID now? [y/N] " ANS
              if [ "$ANS" = "y" ]; then
                plumesign account register-device --udid "$UDID" --name "iPhone"
              fi
            fi
          fi
          LOGIN_SH

          chmod +x "$HOME/bin/start_upterm.sh" "$HOME/login_apple.sh"

      - name: Download source IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p build
          if [ -n "$INPUT_IPA_URL" ]; then
            curl -fsSL -o build/source.ipa "$INPUT_IPA_URL"
          else
            RELEASES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10")
            ASSET_API_URL=$(printf '%s' "$RELEASES" | jq -r '[.[].assets[] | select(.name | test("LiveContainer.*\\.ipa$"; "i")) | select(.name | test("signed|fixed"; "i") | not)][0].url // empty')
            if [ -z "$ASSET_API_URL" ]; then
              echo "::error::No LiveContainer IPA found in the last 10 releases. Upload one or pass ipa_url."
              exit 1
            fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o build/source.ipa "$ASSET_API_URL"
          fi
          ls -lh build/source.ipa

      - name: Strip application-groups from source IPA entitlements
        run: |
          rm -rf build/pre && mkdir -p build/pre
          unzip -q build/source.ipa -d build/pre
          python3 - <<'PY'
          import glob, os, plistlib, subprocess, tempfile

          KEY = "com.apple.security.application-groups"
          app = glob.glob("build/pre/Payload/*.app")[0]
          bundles = [app] + sorted(glob.glob(app + "/PlugIns/*.appex"))
          changed = 0

          for b in bundles:
              with open(b + "/Info.plist", "rb") as f:
                  exe = plistlib.load(f).get("CFBundleExecutable")
              if not exe:
                  continue
              path = os.path.join(b, exe)
              r = subprocess.run(["codesign", "-d", "--entitlements", ":-", path], capture_output=True)
              if not r.stdout.strip():
                  print("no embedded entitlements:", path)
                  continue
              ent = plistlib.loads(r.stdout)
              if KEY not in ent:
                  print("no app-groups:", path)
                  continue
              ent.pop(KEY)
              with tempfile.NamedTemporaryFile(suffix=".plist", delete=False) as t:
                  plistlib.dump(ent, t)
              # ad-hoc re-sign ("-"): needs no certificate or keychain
              r = subprocess.run(["codesign", "-f", "-s", "-", "--entitlements", t.name, "--timestamp=none", path])
              print("stripped app-groups:", path, "-> codesign exit", r.returncode)
              if r.returncode != 0:
                  raise SystemExit(1)
              changed += 1

          print("binaries changed:", changed)
          PY
          (cd build/pre && zip -qry ../stripped.ipa Payload)
          ls -lh build/stripped.ipa

      - name: Open upterm session before authentication
        if: inputs.ssh_before_auth
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # Optional lock-down: restrict who can join (see `upterm host --help`),
          # e.g. UPTERM_ARGS: "--authorized-keys /path/to/keys"
        run: |
          "$HOME/bin/start_upterm.sh" "In the SSH session run: ~/login_apple.sh  then type exit to continue."

      - name: Authenticate with Apple Developer account
        if: ${{ !inputs.ssh_before_auth }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          "$HOME/login_apple.sh"

      - name: Sign IPA with plumesign
        run: |
          plumesign sign \
            --package build/stripped.ipa \
            --apple-id \
            --custom-identifier "$BUNDLE_ID" \
            --output build/LiveContainer+SideStore-signed.ipa

      - name: Inspect signed IPA (diagnostics only)
        continue-on-error: true
        run: |
          rm -rf build/inspect && mkdir -p build/inspect
          unzip -q build/LiveContainer+SideStore-signed.ipa -d build/inspect
          python3 - <<'PY'
          import glob, os, plistlib, subprocess

          UDID = os.environ["UDID"].lower()
          WANT = os.environ["BUNDLE_ID"]
          app = glob.glob("build/inspect/Payload/*.app")[0]

          def info(b):
              with open(b + "/Info.plist", "rb") as f:
                  return plistlib.load(f)

          def ents(path):
              r = subprocess.run(["codesign", "-d", "--entitlements", ":-", path], capture_output=True)
              return plistlib.loads(r.stdout) if r.stdout.strip() else {}

          def profile(b):
              p = b + "/embedded.mobileprovision"
              if not os.path.exists(p):
                  return None
              r = subprocess.run(["security", "cms", "-D", "-i", p], capture_output=True)
              return plistlib.loads(r.stdout) if r.stdout.strip() else None

          for b in [app] + sorted(glob.glob(app + "/PlugIns/*.appex")):
              i = info(b)
              exe = os.path.join(b, i["CFBundleExecutable"])
              e = ents(exe)
              print("==", os.path.basename(b))
              print("bundle id:", i["CFBundleIdentifier"],
                    "| matches manifest:" , i["CFBundleIdentifier"] == WANT if b == app else "n/a")
              print("binary entitlements:", sorted(e))
              pr = profile(b)
              if pr is None:
                  print("NO embedded.mobileprovision")
                  continue
              devs = [d.lower() for d in pr.get("ProvisionedDevices", [])]
              print("profile:", pr.get("Name"), "| team:", pr.get("TeamIdentifier"), "| expires:", pr.get("ExpirationDate"))
              print("devices in profile:", len(devs), "| your UDID included:", UDID in devs)
              granted = pr.get("Entitlements", {})
              print("entitlements NOT granted by profile:", sorted(k for k in e if k not in granted) or "none")
              print("profile entitlement keys:", sorted(granted))

              def uncovered(vals, allowed):
                  return [v for v in vals if not any(v == a or (a.endswith("*") and v.startswith(a[:-1])) for a in allowed)]

              for k in ("com.apple.security.application-groups", "keychain-access-groups"):
                  if k in e:
                      allowed = granted.get(k, [])
                      bad = uncovered(e[k], allowed)
                      print(k, "| binary:", len(e[k]), "items, first:", e[k][:2], "| profile allows:", allowed[:3],
                            "| binary items NOT covered by profile:", len(bad), bad[:3])
              for k, v in e.items():
                  if not isinstance(v, list) and k in granted and granted[k] != v:
                      print("value differs:", k, "binary =", v, "| profile =", granted[k])
          PY

      - name: Host IPA and update Gist manifest
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=build/LiveContainer+SideStore-signed.ipa
          PD_ID=$(curl -fsS -F "file=@$IPA" https://pixeldrain.com/api/file 2>/dev/null | jq -r '.id // empty' || true)
          if [ -n "$PD_ID" ]; then
            IPA_URL="https://pixeldrain.com/api/file/${PD_ID}?download"
          else
            TAG="signed-$(date +%s)"
            gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated OTA build" --prerelease
            IPA_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[0].url')
          fi
          echo "IPA_URL=$IPA_URL"
          export IPA_URL

          python3 - <<'PY'
          import json, os, plistlib, urllib.parse, urllib.request

          token = os.environ.get("GIST_TOKEN", "")
          if not token:
              raise SystemExit("GIST_TOKEN is not set; cannot update manifest")

          manifest = {
              "items": [{
                  "assets": [{"kind": "software-package", "url": os.environ["IPA_URL"]}],
                  "metadata": {
                      "bundle-identifier": os.environ["BUNDLE_ID"],
                      "bundle-version": "1.0",
                      "kind": "software",
                      "title": "LiveContainer",
                  },
              }]
          }
          body = json.dumps({"files": {"manifest.plist": {"content": plistlib.dumps(manifest).decode()}}}).encode()
          req = urllib.request.Request(
              "https://api.github.com/gists/" + os.environ["GIST_ID"],
              data=body,
              method="PATCH",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions",
              },
          )
          res = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
          raw_url = res["files"]["manifest.plist"]["raw_url"]
          itms = "itms-services://?action=download-manifest&url=" + urllib.parse.quote(raw_url, safe="")
          print("GIST_RAW_URL=" + raw_url)
          print("ITMS_URL=" + itms)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("### LiveContainer OTA Link\n`" + itms + "`\n")
          PY

      - name: Open upterm on failure
        if: failure() && inputs.debug_upterm
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ ! -x "$HOME/bin/start_upterm.sh" ]; then
            echo "Helper script missing (job failed before setup)"
            exit 1
          fi
          "$HOME/bin/start_upterm.sh" "A step failed. Debug in the SSH session, then type exit."
