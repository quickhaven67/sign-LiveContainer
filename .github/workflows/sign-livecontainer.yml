name: Sign LiveContainer OTA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to source LiveContainer+SideStore.ipa (defaults to latest release asset)"
        required: false
        default: ""
      debug_upterm:
        description: "Start upterm SSH session on failure"
        required: false
        type: boolean
        default: false

jobs:
  sign-and-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install plumesign and tools
        run: |
          brew install jq || true
          mkdir -p "$HOME/bin"
          curl -fsSL -L -o "$HOME/bin/plumesign" "https://github.com/claration/impactor/releases/latest/download/plumesign-macos-universal"
          chmod +x "$HOME/bin/plumesign"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/plumesign" --help >/dev/null

      - name: Authenticate with Apple Developer account
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TWO_FACTOR_CODE: ${{ secrets.TWO_FACTOR_CODE }}
        run: |
          plumesign account login --username "$APPLE_ID" --password "$APPLE_PASSWORD" ${TWO_FACTOR_CODE:+--code "$TWO_FACTOR_CODE"}

      - name: Download source IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p build
          if [ -n "$INPUT_IPA_URL" ]; then
            curl -fsSL -o build/source.ipa "$INPUT_IPA_URL"
          else
            ASSET_URL=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName,assets --jq '[.[] | .assets[]? | select(.name | test("LiveContainer.*\\.ipa$"; "i")) | select(.name | test("signed|fixed"; "i") | not)][0].url')
            [ -z "$ASSET_URL" ] && ASSET_URL=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json assets --jq '[.[] | .assets[]?][0].url')
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o build/source.ipa "$ASSET_URL"
          fi
          ls -lh build/source.ipa

      - name: Sign IPA with plumesign
        run: |
          plumesign sign \
            --input build/source.ipa \
            --output build/LiveContainer+SideStore-signed.ipa \
            --bundle-id com.kdt.livecontainer.V9CQYDJ2NX \
            --udid 00008130-0014442622DB803A

      - name: Strip application-groups from signed Mach-O entitlements and re-sign
        run: |
          rm -rf build/resign && mkdir -p build/resign
          unzip -q build/LiveContainer+SideStore-signed.ipa -d build/resign
          CERT=$(security find-identity -v -p codesigning | awk '/Dennis Lawson/{print $2; exit}')
          export CERT
          python3 - <<'PY'
          import glob, os, plistlib, re, subprocess

          bins = sorted(
              glob.glob("build/resign/Payload/*.app/LiveContainer")
              + glob.glob("build/resign/Payload/*.app/PlugIns/*.appex/*")
          )
          for p in bins:
              if not os.path.isfile(p) or os.path.islink(p):
                  continue
              if p.endswith((".plist", ".car", ".mobileprovision", ".appintents", ".intentdefinition", ".bundle")):
                  continue
              raw = open(p, "rb").read().decode("latin1")
              matches = re.findall(r"<\?xml.*?</plist>", raw, re.S)
              for m in matches:
                  if "com.apple.security.application-groups" in m:
                      d = plistlib.loads(m.encode("utf-8"))
                      d.pop("com.apple.security.application-groups", None)
                      ent_path = p + ".entitlements.plist"
                      with open(ent_path, "wb") as f:
                          plistlib.dump(d, f)
                      subprocess.run(
                          ["codesign", "-f", "-s", os.environ["CERT"], "--entitlements", ent_path, "--timestamp=none", p],
                          check=False,
                      )
                      break
          PY
          find build/resign/Payload/LiveContainer.app -depth \( -name "*.dylib" -o -name "*.framework" -o -name "*.appex" \) -exec codesign -f -s "$CERT" --timestamp=none {} + 2>/dev/null || true
          MAIN_ENT="build/resign/Payload/LiveContainer.app/LiveContainer.entitlements.plist"
          [ -f "$MAIN_ENT" ] && codesign -f -s "$CERT" --entitlements "$MAIN_ENT" --timestamp=none build/resign/Payload/LiveContainer.app || true
          (cd build/resign && zip -qry ../final.ipa Payload) && mv build/final.ipa build/LiveContainer+SideStore-signed.ipa
          ls -lh build/LiveContainer+SideStore-signed.ipa

      - name: Host IPA and update Gist manifest
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA_URL=$(curl -fsSL -F "file=@build/LiveContainer+SideStore-signed.ipa" https://pixeldrain.com/api/file 2>/dev/null | jq -r '.id // empty' | xargs -I{} echo "https://pixeldrain.com/api/file/{}?download")
          if [ -z "$IPA_URL" ]; then
            TAG="signed-$(date +%s)"
            gh release create "$TAG" build/LiveContainer+SideStore-signed.ipa --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated OTA build" --prerelease
            IPA_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[0].browserDownloadUrl')
          fi
          echo "IPA_URL=$IPA_URL"
          IPA_URL="$IPA_URL" GIST_TOKEN="$GIST_TOKEN" python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          ipa_url = os.environ["IPA_URL"]
          gist_token = os.environ.get("GIST_TOKEN", "")
          plist_xml = f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict><key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>{ipa_url}</string></dict></array><key>metadata</key><dict><key>bundle-identifier</key><string>com.kdt.livecontainer.V9CQYDJ2NX</string><key>bundle-version</key><string>1.0</string><key>kind</key><string>software</string><key>title</key><string>LiveContainer</string></dict></dict></array></dict></plist>"""

          if gist_token:
              payload = json.dumps({"files": {"manifest.plist": {"content": plist_xml}}}).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com/gists/a780f323dcc1db7243c296f4997f43e9",
                  data=payload,
                  method="PATCH",
                  headers={
                      "Authorization": f"Bearer {gist_token}",
                      "Content-Type": "application/json",
                      "User-Agent": "github-actions",
                  },
              )
              res = json.loads(urllib.request.urlopen(req).read().decode("utf-8"))
              raw_url = res["files"]["manifest.plist"]["raw_url"]
              itms_url = "itms-services://?action=download-manifest&url=" + urllib.parse.quote(raw_url, safe="")
              print("GIST_RAW_URL=" + raw_url)
              print("ITMS_URL=" + itms_url)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                  s.write(f"### LiveContainer OTA Link\n`{itms_url}`\n")
          PY

      - name: Start upterm on failure if requested
        if: failure() && inputs.debug_upterm
        run: |
          brew install upterm || true
          upterm host --accept-host-key --force-command "bash -l" -- tmux new -As debug
