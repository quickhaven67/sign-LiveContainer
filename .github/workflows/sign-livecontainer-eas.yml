name: Sign LiveContainer OTA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to source LiveContainer+SideStore.ipa"
        required: false
        default: "https://github.com/LiveContainer/LiveContainer/releases/download/nightly/LiveContainer+SideStore.ipa"
      strip_extensions:
        description: "Remove app extensions (PlugIns) to match the single-app Ad Hoc profile"
        required: false
        type: boolean
        default: true
      debug_upterm:
        description: "Open upterm SSH session on failure"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sign-and-publish:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GIST_ID: a780f323dcc1db7243c296f4997f43e9
      UDID: 00008130-0014442622DB803A
      DEFAULT_P12_PASS: Oasis12345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools and upterm helper
        run: |
          brew install jq tmux || true
          brew install owenthereal/upterm/upterm
          mkdir -p "$HOME/bin" "$HOME/.ssh" "$HOME/eas-creds" build
          chmod 700 "$HOME/.ssh"
          [ -f "$HOME/.ssh/id_ed25519" ] || ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"

          curl -fsSL -L -o "$HOME/bin/plumesign" "https://github.com/claration/impactor/releases/latest/download/plumesign-macos-universal"
          chmod +x "$HOME/bin/plumesign"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/plumesign" --help >/dev/null

          cat > "$HOME/bin/start_upterm.sh" <<'UPTERM_SH'
          #!/usr/bin/env bash
          set -e
          export PATH="$HOME/bin:$PATH"
          HINT="${1:-Session ready.}"
          TIMEOUT="${UPTERM_TIMEOUT:-1800}"

          tmux kill-session -t upterm-wrapper 2>/dev/null || true
          tmux new-session -d -s upterm-wrapper -x 200 -y 50 \
            "upterm host --accept --skip-host-key-check ${UPTERM_ARGS:-} -- bash -l"

          SSH_CMD=""
          for _ in $(seq 1 60); do
            SSH_CMD=$(tmux capture-pane -p -J -S -300 -t upterm-wrapper 2>/dev/null | grep -Eo 'ssh [A-Za-z0-9._@:-]+@[^[:space:]]+' | head -n 1 || true)
            if [ -z "$SSH_CMD" ]; then
              SSH_CMD=$(upterm session current 2>/dev/null | grep -Eo 'ssh [A-Za-z0-9._@:-]+@[^[:space:]]+' | head -n 1 || true)
            fi
            [ -n "$SSH_CMD" ] && break
            sleep 1
          done

          if [ -z "$SSH_CMD" ]; then
            echo "Could not get SSH command from upterm."
            tmux capture-pane -p -t upterm-wrapper 2>/dev/null || true
            exit 1
          fi

          echo "UPTERM_SSH=$SSH_CMD"

          if [ -n "${GIST_TOKEN:-}" ]; then
            SSH_CMD="$SSH_CMD" HINT="$HINT" python3 - <<'PY' || echo "Gist update failed (continuing)"
          import json, os, urllib.request

          content = "\n".join([
              "run " + os.environ.get("GITHUB_RUN_ID", "?"),
              os.environ["HINT"],
              os.environ["SSH_CMD"],
              "",
          ])
          body = json.dumps({"files": {"upterm_ssh.txt": {"content": content}}}).encode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/gists/" + os.environ["GIST_ID"],
              data=body,
              method="PATCH",
              headers={
                  "Authorization": "Bearer " + os.environ["GIST_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions",
              },
          )
          urllib.request.urlopen(req, timeout=20).read()
          print("SSH command published to Gist")
          PY
          fi

          DEADLINE=$((SECONDS + TIMEOUT))
          while tmux has-session -t upterm-wrapper 2>/dev/null; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "upterm session timed out"
              tmux kill-session -t upterm-wrapper 2>/dev/null || true
              break
            fi
            sleep 5
          done
          UPTERM_SH

          chmod +x "$HOME/bin/start_upterm.sh"

      - name: Load signing credentials from certs/
        env:
          P12_SECRET_PASS: ${{ secrets.P12_PASSWORD }}
        run: |
          python3 - <<'PY'
          import glob, os, re, shutil, subprocess

          dest = os.path.expanduser("~/eas-creds")
          os.makedirs(dest, exist_ok=True)

          def first_match(patterns):
              for pat in patterns:
                  matches = sorted(glob.glob(pat))
                  if matches:
                      return matches[0]
              return None

          p12_path = first_match([
              "certs/DistCert_F43463453955D01DBC0808FD106B35F.p12",
              "certs/DistCert_*.p12",
              "DistCert_*.p12",
          ])
          md_path = first_match([
              "certs/DistCertCredentials_F43463453955D01DBC0808FD106B35F.md",
              "certs/DistCertCredentials_*.md",
              "DistCertCredentials_*.md",
          ])
          prov_path = first_match([
              "certs/profile.mobileprovision",
              "certs/*.mobileprovision",
              "*.mobileprovision",
          ])

          if not p12_path:
              raise SystemExit("ERROR: Certificate .p12 not found in certs/")
          if not prov_path:
              raise SystemExit("ERROR: Provisioning profile not found in certs/")

          password = os.environ.get("P12_SECRET_PASS", "").strip()
          if not password and md_path:
              md_text = open(md_path, encoding="utf-8").read()
              m = re.search(r"password:\s*`?([^\s`]+)`?", md_text, re.I)
              if m:
                  password = m.group(1).strip()
          if not password:
              password = os.environ["DEFAULT_P12_PASS"]

          p12_dest = os.path.join(dest, "dist.p12")
          pass_dest = os.path.join(dest, "p12pass")
          cert_dest = os.path.join(dest, "cert.pem")
          key_dest = os.path.join(dest, "key.pem")
          prov_dest = os.path.join(dest, "profile.mobileprovision")

          shutil.copy(p12_path, p12_dest)
          shutil.copy(prov_path, prov_dest)
          with open(pass_dest, "w", encoding="utf-8") as f:
              f.write(password)

          extracted = False
          for openssl_bin in ("openssl", "/opt/homebrew/bin/openssl", "/usr/local/bin/openssl"):
              if not shutil.which(openssl_bin):
                  continue
              for legacy in ([], ["-legacy"]):
                  c_res = subprocess.run(
                      [openssl_bin, "pkcs12", *legacy, "-in", p12_dest,
                       "-passin", f"file:{pass_dest}", "-nokeys", "-clcerts"],
                      capture_output=True, text=True
                  )
                  k_res = subprocess.run(
                      [openssl_bin, "pkcs12", *legacy, "-in", p12_dest,
                       "-passin", f"file:{pass_dest}", "-nodes", "-nocerts"],
                      capture_output=True, text=True
                  )
                  if c_res.returncode == 0 and k_res.returncode == 0 and "-----BEGIN CERTIFICATE-----" in c_res.stdout and "-----BEGIN" in k_res.stdout:
                      certs = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", c_res.stdout, re.S)
                      keys = re.findall(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----", k_res.stdout, re.S)
                      if certs and keys:
                          with open(cert_dest, "w", encoding="utf-8") as f:
                              f.write("\n".join(certs) + "\n")
                          with open(key_dest, "w", encoding="utf-8") as f:
                              f.write(keys[0].strip() + "\n")
                          extracted = True
                          break
              if extracted:
                  break

          if not extracted:
              raise SystemExit("ERROR: Failed to extract cert.pem and key.pem from .p12")

          print("Loaded:", p12_path, "and", prov_path)
          PY

      - name: Validate profile, certificate, and UDID
        run: |
          python3 - <<'PY'
          import os, plistlib, ssl, subprocess, sys

          home = os.path.expanduser("~")
          prof_file = os.path.join(home, "eas-creds", "profile.mobileprovision")
          r = subprocess.run(
              ["security", "cms", "-D", "-i", prof_file],
              capture_output=True,
              check=True,
          )
          prof = plistlib.loads(r.stdout)
          ents = prof.get("Entitlements", {})
          team = prof["TeamIdentifier"][0]
          app_id = ents.get("application-identifier", "")
          raw_bid = app_id[len(team) + 1:] if app_id.startswith(team + ".") else app_id

          devs = [d.lower() for d in prof.get("ProvisionedDevices", [])]
          udid = os.environ["UDID"].lower()
          udid_ok = bool(prof.get("ProvisionsAllDevices")) or (udid in devs)

          cert_pem = open(os.path.join(home, "eas-creds", "cert.pem"), encoding="utf-8").read()
          cert_der = ssl.PEM_cert_to_DER_cert(cert_pem)
          prof_certs = [bytes(c) for c in prof.get("DeveloperCertificates", [])]
          cert_ok = cert_der in prof_certs

          final_bid = (raw_bid[:-1] + "livecontainer") if raw_bid.endswith("*") else raw_bid
          print("Profile:", prof.get("Name"), "| Team:", team, "| Expires:", prof.get("ExpirationDate"))
          print("Provisioned App ID:", raw_bid, "| Target Bundle ID:", final_bid)
          print("UDID included:", udid_ok, "| Cert matches profile:", cert_ok)

          problems = []
          if not udid_ok:
              problems.append(f"UDID {udid} not in profile")
          if not cert_ok:
              problems.append("certificate does not match profile")
          if problems:
              print("ERROR:", "; ".join(problems))
              sys.exit(1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"BUNDLE_ID={final_bid}\n")
          PY

      - name: Download source IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p build
          if [ -n "$INPUT_IPA_URL" ]; then
            curl -fsSL -L -o build/source.ipa "$INPUT_IPA_URL"
          else
            ASSET_API_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" | jq -r '[.[].assets[] | select(.name | test("LiveContainer.*\\.ipa$"; "i")) | select(.name | test("signed|fixed"; "i") | not)][0].url // empty')
            if [ -z "$ASSET_API_URL" ]; then
              echo "::error::No matching LiveContainer IPA asset found in recent releases."
              exit 1
            fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o build/source.ipa "$ASSET_API_URL"
          fi
          ls -lh build/source.ipa

      - name: Prepare IPA for signing
        env:
          STRIP_EXTS: ${{ inputs.strip_extensions }}
        run: |
          rm -rf build/pre && mkdir -p build/pre
          unzip -q build/source.ipa -d build/pre
          APP=$(find build/pre/Payload -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app found inside source IPA"
            exit 1
          fi
          if [ "$STRIP_EXTS" = "true" ]; then
            rm -rf "$APP/PlugIns"
          fi
          EXE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXE_PATH="$APP/$EXE_NAME"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > build/empty.plist
          codesign -f -s - --entitlements build/empty.plist --timestamp=none "$EXE_PATH"
          (cd build/pre && zip -qry ../prepared.ipa Payload)
          ls -lh build/prepared.ipa

      - name: Sign IPA with plumesign
        run: |
          plumesign sign \
            --package build/prepared.ipa \
            --pem "$HOME/eas-creds/cert.pem" "$HOME/eas-creds/key.pem" \
            --provision "$HOME/eas-creds/profile.mobileprovision" \
            --custom-identifier "$BUNDLE_ID" \
            --output build/LiveContainer+SideStore-signed.ipa
          ls -lh build/LiveContainer+SideStore-signed.ipa

      - name: Host IPA and update Gist manifest
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GIST_TOKEN:-}" ]; then
            echo "::error::GIST_TOKEN is required to update manifest.plist"
            exit 1
          fi
          TAG="signed-$(date +%s)"
          cp build/LiveContainer+SideStore-signed.ipa build/LiveContainer-signed.ipa
          gh release create "$TAG" build/LiveContainer-signed.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated OTA build ($BUNDLE_ID)" \
            --prerelease
          IPA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LiveContainer-signed.ipa"
          echo "IPA_URL=$IPA_URL"

          IPA_URL="$IPA_URL" GIST_TOKEN="$GIST_TOKEN" GIST_ID="$GIST_ID" BUNDLE_ID="$BUNDLE_ID" python3 - <<'PY'
          import json, os, plistlib, urllib.parse, urllib.request

          manifest = {
              "items": [{
                  "assets": [{"kind": "software-package", "url": os.environ["IPA_URL"]}],
                  "metadata": {
                      "bundle-identifier": os.environ["BUNDLE_ID"],
                      "bundle-version": "1.0",
                      "kind": "software",
                      "title": "LiveContainer",
                  },
              }]
          }
          body = json.dumps({
              "files": {
                  "manifest.plist": {
                      "content": plistlib.dumps(manifest).decode("utf-8")
                  }
              }
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/gists/" + os.environ["GIST_ID"],
              data=body,
              method="PATCH",
              headers={
                  "Authorization": "Bearer " + os.environ["GIST_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions",
              },
          )
          res = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))
          raw_url = res["files"]["manifest.plist"]["raw_url"]
          itms = "itms-services://?action=download-manifest&url=" + urllib.parse.quote(raw_url, safe="")
          print("GIST_RAW_URL=" + raw_url)
          print("ITMS_URL=" + itms)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as s:
                  s.write(f"### LiveContainer OTA Link\n`{itms}`\n")
          PY

      - name: Open upterm on failure
        if: failure() && inputs.debug_upterm
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -x "$HOME/bin/start_upterm.sh" ]; then
            "$HOME/bin/start_upterm.sh" "A step failed. Inspect in SSH, then type exit."
          fi
